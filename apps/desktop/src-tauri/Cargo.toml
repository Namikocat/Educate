[package]
name = "unilearn-studio"
version = "1.0.1"
description = "UniLearn Studio - offline-first university learning platform"
authors = ["UniLearn Studio"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "unilearn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
